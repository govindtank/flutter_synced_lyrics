name: flutter_synced_lyrics
description: High-performance 120 FPS synchronized lyrics and karaoke engine for Flutter. Supports syllable-level LRC, TTML, Spotify/Apple Music styles, and ambient backdrops.
version: 1.0.1
homepage: https://govindtank.github.io/flutter_synced_lyrics/
repository: https://github.com/govindtank/flutter_synced_lyrics
issue_tracker: https://github.com/govindtank/flutter_synced_lyrics/issues

funding:
  - https://github.com/sponsors/govindtank
  - https://buymeacoffee.com/govindtanko
  - https://www.patreon.com/govindtank

topics:
  - lyrics
  - karaoke
  - audio
  - music-player
  - animation

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
