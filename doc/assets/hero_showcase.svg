<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <!-- Dark modern gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B10" />
      <stop offset="50%" stop-color="#12131C" />
      <stop offset="100%" stop-color="#090A0E" />
    </linearGradient>

    <linearGradient id="appleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="syllableWipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#71717A" />
    </linearGradient>

    <linearGradient id="spotifyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1ED760" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <linearGradient id="cyberpunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="frostedBlur">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="640" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Ambient Lighting Orbs -->
  <circle cx="220" cy="180" r="160" fill="#6366F1" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="980" cy="460" r="190" fill="#EC4899" opacity="0.14" filter="url(#softGlow)" />
  <circle cx="600" cy="320" r="220" fill="#10B981" opacity="0.08" filter="url(#softGlow)" />

  <!-- Top Header Title -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#6366F1" fill-opacity="0.16" stroke="#818CF8" stroke-width="1" />
    <text x="90" y="18" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">FLUTTER PACKAGE</text>

    <text x="0" y="68" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.8">flutter_synced_lyrics</text>
    <text x="0" y="96" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">120 FPS Synchronized Karaoke &amp; Lyrics Engine • LRC, Syllable-Level &amp; Full TTML XML Support</text>
  </g>

  <!-- 3 Interactive Style Showcase Cards -->
  <!-- CARD 1: Apple Music Fluid Syllable Wipe -->
  <g transform="translate(60, 185)" filter="url(#cardShadow)">
    <rect width="340" height="400" rx="18" fill="#181824" stroke="#2E2E42" stroke-width="1.2" />
    <rect width="340" height="400" rx="18" fill="url(#appleGlow)" />

    <!-- Card Badge -->
    <rect x="20" y="20" width="130" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.25" stroke="#A78BFA" stroke-width="0.8" />
    <text x="85" y="36" fill="#DDD6FE" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">🍏 Apple Music Style</text>

    <!-- Lyrics Lines -->
    <!-- Inactive previous line (frosted blur + dimmed) -->
    <text x="24" y="95" fill="#FFFFFF" fill-opacity="0.32" font-family="sans-serif" font-size="16" font-weight="700" filter="url(#frostedBlur)">I've been on my own for long enough</text>

    <!-- ACTIVE Line with Syllable Progress Wipe -->
    <g transform="translate(24, 125)">
      <!-- Background unhighlighted text -->
      <text x="0" y="28" fill="#52525B" font-family="sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4">Maybe you can show me how</text>
      <!-- Highlighted sung text (clipped or gradient) -->
      <text x="0" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4" clip-path="url(#syllableClip)">Maybe you can show </text>
      <clipPath id="syllableClip">
        <rect x="0" y="0" width="195" height="40" />
      </clipPath>
      <!-- Syllable progress bar indicator -->
      <rect x="0" y="42" width="195" height="3" rx="1.5" fill="#FFFFFF" />
      <rect x="195" y="42" width="90" height="3" rx="1.5" fill="#3F3F46" />
    </g>

    <!-- Inactive upcoming lines -->
    <text x="24" y="210" fill="#FFFFFF" fill-opacity="0.32" font-family="sans-serif" font-size="17" font-weight="700" filter="url(#frostedBlur)">You don't even have to do too much</text>
    <text x="24" y="250" fill="#FFFFFF" fill-opacity="0.22" font-family="sans-serif" font-size="16" font-weight="700" filter="url(#frostedBlur)">You can turn me on with just a touch</text>

    <!-- Instrumental Break Visualizer -->
    <g transform="translate(24, 290)">
      <rect width="292" height="42" rx="10" fill="#000000" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <!-- Pulsing dots -->
      <circle cx="30" cy="21" r="5" fill="#00E676" />
      <circle cx="46" cy="21" r="5" fill="#00E676" opacity="0.6" />
      <circle cx="62" cy="21" r="5" fill="#00E676" opacity="0.3" />
      <text x="80" y="25" fill="#E4E4E7" font-family="sans-serif" font-size="12" font-weight="600">Instrumental Break • 4s</text>
    </g>

    <text x="24" y="370" fill="#A1A1AA" font-family="sans-serif" font-size="11">✓ Syllable Gradient Wipe  ✓ Inactive Frosted Blur</text>
  </g>

  <!-- CARD 2: Multilingual Dual-Track (Spotify / J-Pop) -->
  <g transform="translate(430, 185)" filter="url(#cardShadow)">
    <rect width="340" height="400" rx="18" fill="#181824" stroke="#2E2E42" stroke-width="1.2" />

    <!-- Card Badge -->
    <rect x="20" y="20" width="150" height="24" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#34D399" stroke-width="0.8" />
    <text x="95" y="36" fill="#A7F3D0" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">🌐 Multilingual &amp; Spotify</text>

    <!-- Lyrics with Romanization & Translation -->
    <g transform="translate(24, 85)">
      <text x="0" y="14" fill="#6EE7B7" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">YATTO ME WO SAMASHITA KAI</text>
      <text x="0" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">やっと眼を覚ましたかい</text>
      <text x="0" y="66" fill="#9CA3AF" font-family="sans-serif" font-size="13" font-weight="500">Have you finally woken up?</text>
    </g>

    <!-- Active Line Highlight -->
    <g transform="translate(24, 185)">
      <rect x="-8" y="-6" width="308" height="86" rx="10" fill="#1ED760" fill-opacity="0.12" stroke="#1ED760" stroke-opacity="0.3" stroke-width="1" />
      <text x="0" y="14" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SORE NA NO NI NAZE ME MO AWASENAI NDA I?</text>
      <text x="0" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="21" font-weight="900">それなのになぜ眼も合わせやしないんだい？</text>
      <text x="0" y="68" fill="#D1D5DB" font-family="sans-serif" font-size="13" font-weight="600">Then why won't you even meet my eyes?</text>
    </g>

    <!-- Next Line -->
    <g transform="translate(24, 298)">
      <text x="0" y="14" fill="#4B5563" font-family="sans-serif" font-size="11">"OSOI YO" TO OKORU KIMI</text>
      <text x="0" y="38" fill="#6B7280" font-family="sans-serif" font-size="18" font-weight="700">「遅いよ」と怒る君</text>
    </g>

    <text x="24" y="370" fill="#A1A1AA" font-family="sans-serif" font-size="11">✓ Kanji + Romaji + Translation  ✓ Center Snap</text>
  </g>

  <!-- CARD 3: TTML XML Parser & Cyberpunk Mode -->
  <g transform="translate(800, 185)" filter="url(#cardShadow)">
    <rect width="340" height="400" rx="18" fill="#14141E" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- Card Badge -->
    <rect x="20" y="20" width="135" height="24" rx="6" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="0.8" />
    <text x="87" y="36" fill="#00F0FF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">🕹️ Full TTML &amp; Cyber</text>

    <!-- TTML XML Code Snip -->
    <g transform="translate(20, 68)">
      <rect width="300" height="96" rx="8" fill="#0A0B10" stroke="#1F2937" stroke-width="1" />
      <text x="12" y="22" fill="#E5E7EB" font-family="monospace" font-size="10">&lt;p begin="00:03.20" end="00:06.50"&gt;</text>
      <text x="20" y="42" fill="#00F0FF" font-family="monospace" font-size="10">  &lt;span begin="00:03.20"&gt;NEON &lt;/span&gt;</text>
      <text x="20" y="62" fill="#FF0055" font-family="monospace" font-size="10">  &lt;span begin="00:04.50"&gt;LIGHTS&lt;/span&gt;</text>
      <text x="12" y="82" fill="#E5E7EB" font-family="monospace" font-size="10">&lt;/p&gt;</text>
    </g>

    <!-- Active Line Rendered -->
    <g transform="translate(24, 195)">
      <text x="0" y="16" fill="#005566" font-family="monospace" font-size="15" font-weight="700">JACK INTO THE MAINFRAME</text>
      <text x="0" y="52" fill="#00F0FF" font-family="monospace" font-size="23" font-weight="900" letter-spacing="1.5" filter="url(#softGlow)">SYSTEM OVERRIDE</text>
      <text x="0" y="78" fill="#FF0055" font-family="monospace" font-size="12" letter-spacing="1.0">CORE TEMPERATURE NOMINAL</text>
      <text x="0" y="112" fill="#005566" font-family="monospace" font-size="15" font-weight="700">SILICONE DREAMS NEVER DIE</text>
    </g>

    <!-- Floating Snap-Back Pill Preview -->
    <g transform="translate(55, 320)">
      <rect width="230" height="34" rx="17" fill="#1F202E" stroke="#00F0FF" stroke-width="1" />
      <path d="M 75 17 L 85 24 L 95 17" stroke="#00F0FF" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="145" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Return to current line</text>
    </g>

    <text x="24" y="380" fill="#A1A1AA" font-family="sans-serif" font-size="11">✓ Timed Text XML (TTML)  ✓ Monospace Scanlines</text>
  </g>
</svg>
